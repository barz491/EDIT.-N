<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer - KreatifDKV Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="../assets/tw.js"></script><link rel="stylesheet" href="../assets/style.css"></head><body><script src="../assets/app.js"></script><script>

let S={q:QS('q'),tab:'all',cat:'',pg:1};
shell('Customer','Data Customer & Klien','Kelola kontak klien, riwayat pemesanan jasa desain, interaksi langsung tim admin WhatsApp, dan pantau status pengerjaan proyek secara real-time.','',btn('Export Data (Excel/CSV)',0,'expC()')+btn('+ Tambah Customer Baru',1,'addC()'),`<div id="st"></div><div class="${card} flex gap-2 text-xs mb-5 items-center"><span id="tabs" class="flex gap-2"></span>${srch('Cari berdasarkan nama, brand, WhatsApp',S.q)}${sel('cat','Semua Kategori',CATS)}</div><div id="out"></div>`);
const info=c=>{const os=DB.orders.filter(o=>o.cust==c.name).sort((a,b)=>b.id.localeCompare(a.id));return{...c,os,last:os[0],total:os.length+c.prev,active:os.some(o=>o.status!='Selesai')}};
const fl=()=>DB.customers.map(info).filter(c=>(S.tab=='all'||(S.tab=='act'&&c.active)||(S.tab=='rep'&&c.total>1))&&(!S.cat||(c.last&&c.last.cat==S.cat))&&(c.name+c.brand+c.wa).toLowerCase().includes(S.q.toLowerCase()));
const expC=()=>csv('customer',[['Nama','Brand','WA','Total Pesanan','Total Nilai'],...fl().map(c=>[c.name,c.brand,c.wa,c.total,c.os.reduce((a,o)=>a+o.amount,0)])]);
function addC(){modal('Tambah Customer Baru',fld('n1','Nama Klien')+fld('n2','Brand / Instansi')+fld('n3','Nomor WhatsApp'),{ok:'Simpan',onOk(){if(!g('n1')){toast('Nama wajib diisi');return false}if(DB.customers.some(c=>c.name.toLowerCase()==g('n1').toLowerCase())){toast('Customer sudah ada');return false}DB.customers.unshift({name:g('n1'),brand:g('n2')||g('n1'),wa:g('n3')||'-',prev:0});addLog('Customer baru '+g('n1')+' ditambahkan.','Data Customer');save();toast('Customer ditambahkan');R()}})}
function detC(n){const c=info(DB.customers.find(x=>x.name==n));modal('Detail Klien',`<div class="bg-indigo-50/60 rounded-xl p-3"><b class="text-sm">${c.name}</b><br>${c.brand} • ${c.wa}<br>Total pesanan: ${c.total} • Total transaksi: ${rp(c.os.reduce((a,o)=>a+o.amount,0))}</div><b>Riwayat Pesanan</b>${c.os.map(o=>`<a href="pesanan.html?q=${o.id}" class="flex justify-between bg-slate-50 rounded-lg p-2.5"><span><b class="text-brand">${o.id}</b> ${o.svc}</span>${pill(o.status,SC[o.status])}</a>`).join('')||'<p class="text-slate-500">Belum ada pesanan.</p>'}`,{w:'max-w-xl'})}
function R(){const A=DB.customers.map(info),L=fl(),tot=A.reduce((s,c)=>s+c.os.reduce((a,o)=>a+o.amount,0),0),no=A.reduce((s,c)=>s+c.os.length,0);
$('st').innerHTML=stats([['TOTAL CUSTOMER',A.length+' Klien','Terdaftar di direktori','group'],['CUSTOMER AKTIF',A.filter(c=>c.active).length+' Klien','Proyek sedang dikerjakan','badge'],['REPEAT ORDER',A.filter(c=>c.total>1).length+' Klien',Math.round(A.filter(c=>c.total>1).length/Math.max(1,A.length)*100)+'% retensi repeat order','autorenew'],['TOTAL TRANSAKSI KLIEN',rp(tot),'Rata-rata '+rp(Math.round(tot/Math.max(1,no)))+' / order','account_balance_wallet']]);
$('tabs').innerHTML=[['all','Semua Klien '+A.length],['act','Order Aktif '+A.filter(c=>c.active).length],['rep','Pelanggan Repeat '+A.filter(c=>c.total>1).length]].map(([k,t])=>`<button onclick="S.tab='${k}';R()" class="rounded-xl px-4 py-2.5 font-bold whitespace-nowrap ${S.tab==k?'bg-brand text-white':'bg-indigo-50'}">${t}</button>`).join('');
$('out').innerHTML=`<div class="grid grid-cols-2 gap-5">${L.map(c=>{const o=c.last,w=o&&o.pay=='Menunggu Pembayaran';return`<div class="${card}"><div class="flex justify-between items-center"><span class="flex items-center gap-3"><b class="w-9 h-9 rounded-lg bg-indigo-100 text-brand text-[11px] grid place-items-center">${c.name.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase()}</b><span><b class="text-sm">${c.name}</b><br><span class="text-[10px] text-slate-500">${c.brand}</span></span></span><span class="flex gap-1">${pill(c.total?c.total+' Pesanan':'Baru','bg-slate-100 text-slate-600')}${pill(c.active?(w?'Menunggu DP':'Order Aktif'):c.total?'Selesai / Lunas':'Baru',c.active?(w?'bg-slate-100 text-slate-600':'bg-indigo-100 text-brand'):'bg-emerald-100 text-emerald-700')}</span></div>
${o?`<div class="bg-indigo-50/60 rounded-xl p-3 mt-3 text-[11px]"><div class="flex justify-between text-slate-500"><span>ORDER TERAKHIR</span><b class="text-brand">#${o.id}</b></div><div class="flex justify-between mt-1"><b>${o.svc}</b><span>Total: <b class="text-brand">${rp(o.amount)}</b></span></div><div class="text-slate-600 mt-1">Designer: <b>${o.designer||'Menunggu Penugasan'}</b></div></div>`:`<div class="bg-indigo-50/60 rounded-xl p-3 mt-3 text-[11px] text-slate-500">Belum ada pesanan.</div>`}
<div class="flex justify-between items-center mt-3 text-[11px] font-bold"><span class="font-mono">${c.wa}</span><span class="flex gap-2"><button onclick="wa('Halo ${c.name}, kami dari KreatifDKV','${c.wa}')" class="bg-wa text-white rounded-lg px-3 py-1.5">Chat WA</button><button onclick="detC('${c.name.replace(/'/g,"\\'")}')" class="bg-slate-100 rounded-lg px-3 py-1.5">Detail Klien</button>${w?`<a href="pembayaran.html?q=${o.id}" class="bg-indigo-100 text-brand rounded-lg px-3 py-1.5">Konfirmasi DP</a>`:`<button onclick="orderForm({cust:'${c.name.replace(/'/g,"\\'")}',wa:'${c.wa}'})" class="bg-brand text-white rounded-lg px-3 py-1.5">+ Buat Order</button>`}</span></div></div>`}).join('')||'<p class="text-slate-500 text-xs col-span-2">Customer tidak ditemukan.</p>'}</div><div class="${card} mt-5 flex justify-between items-center"><div><b>Tips Admin Mengelola Klien</b><p class="text-[11px] text-slate-500">Hubungi klien via WhatsApp untuk konfirmasi brief sebelum order diserahkan ke designer. Catat revisi pada profil customer.</p></div><button onclick="modal('SOP Pengelolaan Klien','<p>1. Konfirmasi brief via WhatsApp sebelum order dibuat.</p><p>2. DP minimal '+DB.set.dp+'% terverifikasi sebelum pengerjaan.</p><p>3. Catat seluruh revisi pada profil customer.</p>')" class="font-bold text-brand text-xs">Pelajari SOP Studio →</button></div>`}
$('out')&&R();
</script></body></html>

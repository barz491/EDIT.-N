<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Designer / Staff DKV - KreatifDKV Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="../assets/tw.js"></script><link rel="stylesheet" href="../assets/style.css"></head><body><script src="../assets/app.js"></script><script>

let S={q:'',c:'',av:'',sort:'Beban Kerja Terbanyak'};
shell('Designer / Staff DKV','Kelola Designer & Tim Kreatif DKV','Pantau ketersediaan talenta desainer, penugasan order aktif, kapasitas beban kerja, dan komisi hak desainer (70% desainer / 30% studio).','',btn('Export Data Tim (Excel)',0,"csv('designer',[['Nama','Peran','Kategori','Order Aktif','Kapasitas','Rating','Komisi'],...DB.designers.map(d=>[d.name,d.role,d.cat,act().filter(o=>o.designer==d.name).length,d.cap,d.rating,d.komisi])])")+btn('+ Tambah Desainer Baru',1,'addD()'),`<div id="st"></div><div class="${card} flex gap-2 text-xs mb-5 items-center"><span id="tabs" class="flex gap-2"></span><div class="flex-1 bg-indigo-50/60 rounded-xl px-3 py-2.5 flex gap-2">${I('search')}<input oninput="S.q=this.value;R()" placeholder="Cari nama desainer, software, skill..." class="bg-transparent outline-none w-full"></div><select onchange="S.av=this.value;R()" class="bg-indigo-50/60 rounded-xl px-3 py-2.5 font-semibold outline-none"><option value="">Semua Status Ketersediaan</option><option>Ready</option><option>Hampir Penuh</option><option>Slot Penuh</option></select><select onchange="S.sort=this.value;R()" class="bg-indigo-50/60 rounded-xl px-3 py-2.5 font-semibold outline-none"><option>Beban Kerja Terbanyak</option><option>Rating Tertinggi</option><option>Nama A-Z</option></select></div><div id="out"></div>`);
const mine=d=>act().filter(o=>o.designer==d.name),st=d=>{const n=mine(d).length;return n>=d.cap?'Slot Penuh':n==d.cap-1?'Hampir Penuh':'Ready'};
function addD(){modal('Tambah Desainer Baru',fld('d1','Nama Lengkap')+fld('d2','Peran / Jabatan','Graphic Designer')+fld('d3','Divisi',CATS[0],CATS)+fld('d4','Spesialisasi')+fld('d5','Software & Tools')+fld('d6','Nomor WhatsApp')+fld('d7','Kapasitas Slot Order',3,'number'),{ok:'Simpan Desainer',onOk(){if(!g('d1')){toast('Nama wajib diisi');return false}DB.designers.push({name:g('d1'),role:g('d2'),cat:g('d3'),spec:g('d4')||g('d2'),tools:g('d5')||'-',rating:5,done:0,komisi:0,cap:+g('d7')||3,wa:g('d6')||'-'});addLog('Desainer '+g('d1')+' ditambahkan ke tim.','Tim Kreatif');save();toast('Desainer ditambahkan');R()}})}
function det(n){const d=DB.designers.find(x=>x.name==n);modal(d.name+' — '+d.role,`<div class="grid grid-cols-2 gap-3"><div class="bg-indigo-50/60 rounded-xl p-3"><b>Spesialisasi</b><br>${d.spec}</div><div class="bg-indigo-50/60 rounded-xl p-3"><b>Tools</b><br>${d.tools}</div><div class="bg-indigo-50/60 rounded-xl p-3"><b>Rating</b><br>★ ${d.rating} (${d.done} selesai)</div><div class="bg-indigo-50/60 rounded-xl p-3"><b>Total Komisi</b><br>${rp(d.komisi)}</div></div><b>Order Aktif</b>${mine(d).map(o=>`<a href="pesanan.html?q=${o.id}" class="flex justify-between bg-slate-50 rounded-lg p-2.5"><span><b class="text-brand">${o.id}</b> ${o.svc}</span><b>${o.progress}%</b></a>`).join('')||'<p class="text-slate-500">Tidak ada order aktif.</p>'}<a href="../portofolio.html" target="_blank" class="font-bold text-brand">Lihat portofolio di halaman customer ↗</a>`,{w:'max-w-xl'})}
function R(){const A=DB.designers,L=A.filter(d=>(!S.c||d.cat==S.c)&&(!S.av||st(d)==S.av)&&(d.name+d.tools+d.spec+d.role).toLowerCase().includes(S.q.toLowerCase())).sort((a,b)=>S.sort=='Rating Tertinggi'?b.rating-a.rating:S.sort=='Nama A-Z'?a.name.localeCompare(b.name):mine(b).length-mine(a).length),cap=A.reduce((s,d)=>s+d.cap,0);
$('st').innerHTML=stats([['TOTAL DESIGNER AKTIF',A.length+' Talenta','Terbagi di '+new Set(A.map(d=>d.cat)).size+' divisi','badge'],['ORDER SEDANG DIKERJAKAN',act().filter(o=>o.designer).length+' Project','Target serah terima tepat waktu','assignment'],['RATA-RATA KAPASITAS',Math.round(act().filter(o=>o.designer).length/cap*100)+'% Terpakai',A.filter(d=>st(d)=='Ready').length+' desainer siap ambil order','speed'],['TOTAL KOMISI',rp(A.reduce((s,d)=>s+d.komisi,0)),'Akumulasi hak komisi '+DB.set.split+'% tim','payments']]);
$('tabs').innerHTML=['',...CATS].map(c=>`<button onclick="S.c='${c}';R()" class="rounded-xl px-3 py-2.5 font-bold whitespace-nowrap ${S.c==c?'bg-brand text-white':'bg-indigo-50'}">${c||'Semua'}</button>`).join('');
$('out').innerHTML=`<div class="grid grid-cols-3 gap-5">${L.map(d=>{const m=mine(d),s=st(d),p=Math.min(100,Math.round(m.length/d.cap*100));return`<div class="${card}"><div class="flex justify-between items-start"><span class="flex items-center gap-2"><b class="w-9 h-9 rounded-lg bg-indigo-100 text-brand text-[11px] grid place-items-center">${d.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</b><span><b class="text-sm">${d.name}</b><br><span class="text-[10px] text-slate-500">${d.role}</span></span></span>${pill(s+' ('+m.length+'/'+d.cap+')',s=='Ready'?'bg-emerald-100 text-emerald-700':s=='Slot Penuh'?'bg-red-100 text-red-600':'bg-amber-100 text-amber-700')}</div><div class="bg-indigo-50/60 rounded-lg p-2.5 mt-3 text-[11px]">Spesialisasi: ${d.spec}</div><p class="text-[10px] font-bold text-slate-500 mt-3">SOFTWARE & TOOLS</p><p class="text-[11px] mt-1">${d.tools}</p><div class="bg-indigo-50/60 rounded-lg p-2.5 mt-3 text-[11px]"><b>Order Aktif (${m.length} Berjalan)</b> ${p}% Kapasitas<div class="h-1.5 bg-indigo-100 rounded-full mt-2"><div class="h-1.5 rounded-full ${p>=100?'bg-red-600':'bg-brand2'}" style="width:${p}%"></div></div>${m.slice(0,2).map(o=>`<div class="mt-1 truncate">#${o.id} ${o.svc}</div>`).join('')}</div><div class="grid grid-cols-2 gap-3 mt-3 text-[11px]"><div class="border rounded-lg p-2">Rating<br><b>★ ${d.rating}</b> (${d.done} selesai)</div><div class="border rounded-lg p-2">Total Komisi<br><b>${rp(d.komisi)}</b></div></div><button onclick="wa('Halo ${d.name}, ada update order?','${d.wa}')" class="w-full bg-wa text-white font-bold text-[11px] rounded-lg py-2.5 mt-3">Chat WA Desainer</button><div class="grid grid-cols-2 gap-2 mt-2 text-[11px] font-bold"><button onclick="det('${d.name}')" class="bg-indigo-50 rounded-lg py-2">Detail & Portofolio</button>${s=='Slot Penuh'?`<button onclick="toast('Slot ${d.name} sudah penuh')" class="bg-slate-100 text-slate-400 rounded-lg py-2">Slot Penuh</button>`:`<button onclick="tugaskan('${d.name}')" class="bg-brand text-white rounded-lg py-2">Tugaskan Order</button>`}</div></div>`}).join('')||'<p class="col-span-3 text-center text-slate-500">Desainer tidak ditemukan.</p>'}</div><div class="${card} bg-indigo-50/60 mt-5"><h2 class="font-bold text-base">SOP Pembagian Order & Hak Komisi Desainer</h2><div class="grid grid-cols-3 gap-4 mt-3 text-[11px]">${[['Batas Beban Kerja','Maksimal 3–4 order aktif per desainer agar kualitas dan deadline terjaga.'],['Skema Pembagian Hasil',DB.set.split+'% hak komisi Designer dicatat Admin, '+(100-DB.set.split)+'% untuk kas operasional studio.'],['Jalur Koordinasi Terbuka','Admin menugaskan Designer saat membuat Order via koordinasi WhatsApp / internal studio.']].map((s,i)=>`<div class="bg-white rounded-xl p-3"><b>${i+1}. ${s[0]}</b><p class="text-slate-500 mt-1">${s[1]}</p></div>`).join('')}</div></div>`}
$('out')&&R();
</script></body></html>

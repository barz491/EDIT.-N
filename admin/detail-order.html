<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail Order - KreatifDKV Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="../assets/tw.js"></script><link rel="stylesheet" href="../assets/style.css"></head><body><script src="../assets/app.js"></script><script>

let id=QS('id').toUpperCase();if(!DB.orders.some(o=>o.id==id))id=(act()[0]||DB.orders[0]||{}).id;
const ST=['Brief & Analisis Kebutuhan Klien','Eksplorasi Konsep & Moodboard Visual','Pembuatan Desain & Layout / Produksi','Preview Hasil Karya','Sesi Revisi & Penyempurnaan Detail','Finalisasi File Siap Pakai','Serah Terima Master File & Selesai'],STS=['Menunggu DP','Sedang Dikerjakan','Menunggu Review','Revisi','Selesai'],PYS=['Menunggu Pembayaran','DP 50%','Lunas'],PSS=['Menunggu Pembayaran','Dalam Verifikasi','Bukti Diterima','DP Terverifikasi','Lunas'];
shell('Detail Order','Detail Order','Kelola satu pesanan secara lengkap: milestone pengerjaan, pembayaran, berkas proyek, revisi, dan catatan untuk customer.','',`<select onchange="location='detail-order.html?id='+this.value" class="bg-white shadow-sm rounded-xl px-3 py-2.5 outline-none max-w-[270px]">${DB.orders.map(o=>`<option value="${o.id}" ${o.id==id?'selected':''}>${o.id} — ${o.cust}</option>`).join('')}</select>`,'<div id="out"></div>');
const od=()=>DB.orders.find(x=>x.id==id),cur=o=>o.status=='Selesai'?8:Math.min(7,Math.floor(o.progress/100*7)+1),maxRev=()=>parseInt(DB.set.rev)||2;
function upd(m,s){addLog(id+' '+m,s||'Detail Order');save();R()}
function setStep(n){const o=od();o.progress=n==1?0:Math.ceil((n-1)/7*100);if(o.status!='Menunggu DP')o.status=n==4?'Menunggu Review':n==5?'Revisi':'Sedang Dikerjakan';upd('dipindah ke tahap '+n+': '+ST[n-1]+'.');toast('Tahap aktif: '+n)}
function finish(){const o=od();if(o.pay!='Lunas'&&!confirm('Pembayaran belum lunas. Master file sebaiknya diserahkan setelah lunas. Tetap tandai selesai?'))return;o.status='Selesai';o.progress=100;upd('ditandai selesai & serah terima.','Status Order Selesai');toast('Order ditandai selesai')}
function postNote(){const t=g('n1');if(!t)return toast('Tulis catatan terlebih dulu');const o=od();o.note=t;o.noteAt=new Date().toISOString().slice(0,16);upd('update untuk customer: '+t.slice(0,60),'Update ke Customer');toast('Catatan tampil di Lacak Pesanan customer')}
function saveInt(){od().internal=g('n2');save();toast('Catatan internal disimpan')}
function revi(d){const o=od();o.rev=Math.max(0,(o.rev||0)+d);if(o.rev>maxRev())toast('Kuota revisi habis — revisi tambahan dikenakan tarif');upd('jumlah revisi terpakai: '+o.rev+'.');}
function addFile(){modal('Tambah Berkas Proyek',`<label class="block font-bold">Pilih File (opsional)<input id="fl" type="file" class="${IC}" onchange="if(this.files[0])$('fn').value=this.files[0].name"></label>${fld('fn','Nama Berkas','')}${fld('ft','Jenis','Preview',['Preview','Dokumen','Master File'])}<p class="text-slate-500">Catatan: yang disimpan hanya nama & ukuran file (belum ada penyimpanan file asli di versi ini).</p>`,{ok:'Tambah Berkas',onOk(){if(!g('fn')){toast('Nama berkas wajib diisi');return false}const f=$('fl').files[0],o=od();(o.files=o.files||[]).push({name:g('fn'),size:f?(f.size/1048576).toFixed(1)+' MB':'—',type:g('ft'),date:today()});upd('berkas ditambahkan: '+g('fn')+'.','Berkas Proyek');toast('Berkas ditambahkan')}})}
function delFile(i){od().files.splice(i,1);save();toast('Berkas dihapus');R()}
function editD(){const o=od();modal('Edit Order '+id,fld('e1','Judul Layanan',o.svc)+fld('e2','Nama Customer',o.cust)+fld('e3','WhatsApp',o.wa)+fld('e4','Designer',o.designer||'Menunggu Designer',['Menunggu Designer',...DB.designers.map(d=>d.name)])+fld('e5','Status Order',o.status,STS)+fld('e6','Status Pembayaran',o.pay,PYS)+fld('e7','Deadline',o.deadline,'date')+fld('e8','Nilai Order (Rp)',o.amount,'number'),{ok:'Simpan Perubahan',onOk(){o.svc=g('e1');o.cust=g('e2');o.wa=g('e3');o.designer=g('e4')=='Menunggu Designer'?'':g('e4');o.status=g('e5');o.pay=g('e6');o.deadline=g('e7');o.amount=+g('e8');if(o.status=='Selesai')o.progress=100;upd('data order diperbarui.');toast('Order diperbarui')}})}
function chgP(pid,v){const p=DB.payments.find(x=>x.id==pid),o=od();p.status=v;if(v=='Lunas')o.pay='Lunas';else if(v=='DP Terverifikasi'){o.pay='DP 50%';if(o.status=='Menunggu DP')o.status='Sedang Dikerjakan'}upd('pembayaran '+p.type+' → '+v+'.','Verifikasi Pembayaran');toast('Status pembayaran diperbarui')}
function setDes(v){od().designer=v=='Menunggu Designer'?'':v;upd('designer diubah ke '+v+'.','Penugasan Designer')}
function del(){if(!confirm('Hapus order '+id+' secara permanen?'))return;DB.orders=DB.orders.filter(o=>o.id!=id);addLog('Order '+id+' dihapus oleh admin.','Hapus Order');save();location='pesanan.html'}
function R(){const o=od();if(!o){$('out').innerHTML=`<div class="${card} mt-5 text-center text-slate-500">Belum ada order. <a href="pesanan.html" class="text-brand font-bold">Buat pesanan di halaman Pesanan →</a></div>`;return}
const c=cur(o),dp=Math.round(o.amount*DB.set.dp/100),pm=DB.payments.filter(p=>p.order==o.id),paid=pm.filter(p=>['DP Terverifikasi','Lunas'].includes(p.status)).reduce((s,p)=>s+p.amount,0),dl=Math.ceil((new Date(o.deadline)-new Date(today()))/864e5),ls=DB.log.filter(l=>l.m.includes(o.id)).slice(0,6),rv=o.rev||0;
$('out').innerHTML=`<section class="${card} mt-5"><div class="flex justify-between gap-4"><div><span class="bg-indigo-100 text-brand font-extrabold text-lg rounded-lg px-3 py-1">${o.id}</span> <b class="text-base ml-2">${o.svc}</b><p class="text-[11px] text-slate-500 mt-2">${o.cust} • ${o.wa} • ${pill(o.cat)}</p></div><div class="flex gap-2 text-[11px] font-bold h-fit shrink-0"><button onclick="wa('Halo ${o.cust}, update pesanan ${o.id}','${o.wa}')" class="bg-wa text-white rounded-lg px-4 py-2">Chat WA Customer</button><a href="../lacak.html?id=${o.id}" target="_blank" class="bg-indigo-50 rounded-lg px-4 py-2">Lihat sebagai Customer ↗</a><button onclick="editD()" class="bg-brand text-white rounded-lg px-4 py-2">Edit Order</button></div></div>
<div class="grid grid-cols-4 gap-4 mt-5 pt-4 border-t text-[11px]"><div><span class="text-slate-500">STATUS PENGERJAAN</span><br>${pill(o.status,SC[o.status])}${o.status!='Selesai'?' <b class="text-slate-500">Tahap '+c+'/7</b>':''}</div><div><span class="text-slate-500">STATUS PEMBAYARAN</span><br>${sp(o.pay)}</div><div><span class="text-slate-500">PROGRESS</span><br><b class="text-brand text-base">${o.progress}%</b><div class="h-1.5 bg-indigo-100 rounded-full mt-1"><div class="h-1.5 rounded-full bg-brand2" style="width:${o.progress}%"></div></div></div><div><span class="text-slate-500">DEADLINE</span><br><b>${fd(o.deadline)}</b> <span class="${dl<0&&o.status!='Selesai'?'text-red-600':'text-slate-500'}">${o.status=='Selesai'?'• Selesai':dl<0?'• Terlambat '+(-dl)+' hari':dl==0?'• Hari ini':'• '+dl+' hari lagi'}</span></div></div></section>
<div class="grid grid-cols-[1fr_330px] gap-5 mt-5"><div class="space-y-5 min-w-0">
<section class="${card}"><div class="flex justify-between"><div><b class="text-base">Milestone Pengerjaan</b><p class="text-[11px] text-slate-500">Pindahkan tahap aktif — otomatis tampil di Lacak Pesanan customer.</p></div>${pill(o.status=='Selesai'?'Selesai':'Tahap '+c+' dari 7')}</div><div class="mt-4 space-y-2.5">${ST.map((x,i)=>{const n=i+1,dn=n<c,ac=n==c;return`<div class="flex gap-3 items-start"><b class="w-7 h-7 shrink-0 rounded-full grid place-items-center text-[10px] ${dn?'bg-emerald-800 text-white':ac?'bg-brand text-white':'bg-indigo-100 text-brand'}">${dn?'✓':n}</b><div class="flex-1 rounded-xl p-3 ${ac?'bg-indigo-100 border border-brand/40':'bg-indigo-50/60'} flex justify-between items-center gap-3"><div><b>${n}. ${x}</b><div class="text-[10px] text-slate-500">${dn?'Completed':ac?'IN PROGRESS • AKTIF':'Pending'}</div></div>${ac?(n==7?`<button onclick="finish()" class="text-[11px] font-bold bg-emerald-700 text-white rounded-lg px-3 py-1.5 whitespace-nowrap">Tandai Selesai</button>`:`<button onclick="setStep(${n+1})" class="text-[11px] font-bold bg-brand text-white rounded-lg px-3 py-1.5 whitespace-nowrap">Selesaikan Tahap ▸</button>`):`<button onclick="setStep(${n})" class="text-[11px] font-bold text-brand whitespace-nowrap">Jadikan Aktif</button>`}</div></div>`}).join('')}</div>${o.status!='Selesai'?`<button onclick="finish()" class="mt-4 text-xs font-bold bg-emerald-50 text-emerald-800 rounded-xl px-4 py-2.5">${I('task_alt')} Tandai Order Selesai (Serah Terima)</button>`:`<div class="mt-4 text-xs bg-emerald-50 text-emerald-800 rounded-xl p-3 font-semibold">Order selesai. <button onclick="setStep(5)" class="underline">Buka lagi untuk revisi</button></div>`}</section>
<section class="${card}"><b class="text-base">Update untuk Customer</b><p class="text-[11px] text-slate-500">Catatan ini tampil di halaman Lacak Pesanan customer.</p>${o.note?`<div class="bg-indigo-50/60 rounded-xl p-3 mt-3 text-[11px]"><b>Terakhir (${fd(o.noteAt)}):</b> ${o.note}</div>`:''}<textarea id="n1" rows="3" placeholder="Contoh: Mockup 3D sudah diunggah, mohon dicek dan beri masukan." class="${IC} mt-3 text-xs"></textarea><div class="flex justify-end mt-2"><button onclick="postNote()" class="bg-brand text-white font-bold text-xs rounded-lg px-4 py-2.5">Kirim Update</button></div></section>
<section class="${card}"><div class="flex justify-between items-center"><b class="text-base">Berkas Proyek</b><button onclick="addFile()" class="text-xs font-bold text-brand">+ Tambah Berkas</button></div><div class="mt-3 space-y-2">${(o.files||[]).map((f,i)=>`<div class="flex justify-between items-center bg-indigo-50/60 rounded-xl p-3 text-[11px]"><span>${I('description')} <b>${f.name}</b><br><span class="text-slate-500">${f.size} • ${fd(f.date)}</span></span><span class="flex items-center gap-3">${pill(f.type)}<button onclick="delFile(${i})" class="text-red-500">${I('delete')}</button></span></div>`).join('')||'<p class="text-xs text-slate-500">Belum ada berkas. Tambahkan preview atau dokumen proyek.</p>'}</div></section></div>
<div class="space-y-5"><section class="${card} text-[11px]"><b class="text-base">Informasi Pesanan</b><div class="mt-3 space-y-2">${[['CUSTOMER',o.cust],['KATEGORI',o.cat],['NILAI ORDER',rp(o.amount)],['DP '+DB.set.dp+'%',rp(dp)],['SISA TAGIHAN',rp(Math.max(0,o.amount-paid))]].map(x=>`<div class="flex justify-between bg-indigo-50/60 rounded-lg p-2.5"><span class="text-slate-500">${x[0]}</span><b>${x[1]}</b></div>`).join('')}<label class="block font-bold text-[10px] text-slate-500">DESIGNER PROYEK<select onchange="setDes(this.value)" class="${IC} text-[12px] text-ink">${['Menunggu Designer',...DB.designers.map(d=>d.name)].map(n=>`<option ${n==(o.designer||'Menunggu Designer')?'selected':''}>${n}</option>`).join('')}</select></label></div></section>
<section class="${card}"><div class="flex justify-between"><b class="text-base">Pembayaran Order</b><a href="pembayaran.html?q=${o.id}" class="text-[11px] font-bold text-brand">Kelola ›</a></div><div class="mt-3 space-y-2 text-[11px]">${pm.map(p=>`<div class="bg-indigo-50/60 rounded-xl p-3"><div class="flex justify-between"><b>${p.type}</b><b>${rp(p.amount)}</b></div><div class="text-slate-500">${p.channel} • ${fd(p.time)}</div><select onchange="chgP('${p.id}',this.value)" class="${IC} text-[11px]">${PSS.map(s=>`<option ${s==p.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p class="text-slate-500">Belum ada transaksi tercatat untuk order ini.</p>'}</div></section>
<section class="${card}"><b class="text-base">Kuota Revisi</b><div class="flex items-center justify-between mt-3"><div class="text-[11px]"><b class="text-lg ${rv>maxRev()?'text-red-600':'text-brand'}">${rv}</b> / ${maxRev()} terpakai<br><span class="text-slate-500">${DB.set.rev}</span></div><span class="flex gap-2"><button onclick="revi(-1)" class="w-8 h-8 rounded-lg bg-indigo-50 font-bold">−</button><button onclick="revi(1)" class="w-8 h-8 rounded-lg bg-brand text-white font-bold">+</button></span></div></section>
<section class="${card}"><b class="text-base">Catatan Internal</b><p class="text-[11px] text-slate-500">Hanya terlihat oleh admin.</p><textarea id="n2" rows="3" class="${IC} mt-2 text-xs">${o.internal||''}</textarea><div class="flex justify-end mt-2"><button onclick="saveInt()" class="bg-indigo-50 text-brand font-bold text-xs rounded-lg px-4 py-2">Simpan Catatan</button></div></section>
<section class="${card}"><b class="text-base">Aktivitas Order</b><div class="mt-3 space-y-2 text-[11px]">${ls.map(l=>`<div class="bg-indigo-50/60 rounded-lg p-2.5"><b>${l.t}</b><br>${l.m}</div>`).join('')||'<p class="text-slate-500">Belum ada aktivitas tercatat.</p>'}</div></section>
<button onclick="del()" class="w-full text-xs font-bold text-red-600 bg-red-50 rounded-xl py-2.5">${I('delete')} Hapus Order</button></div></div>`}
$('out')&&R();
</script></body></html>

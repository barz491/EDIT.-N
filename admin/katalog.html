<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katalog Jasa - KreatifDKV Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="../assets/tw.js"></script><link rel="stylesheet" href="../assets/style.css"></head><body><script src="../assets/app.js"></script><script>

let S={q:'',c:'',st:'',sort:'Terpopuler'};const GR=['from-indigo-700 to-slate-800','from-slate-700 to-slate-900','from-amber-700 to-stone-800','from-cyan-700 to-slate-900','from-stone-500 to-stone-800','from-blue-700 to-slate-800'];
shell('Katalog Jasa','Kelola Katalog Layanan Jasa','Atur daftar paket jasa desain, editing video, animasi, dan 3D visual yang ditawarkan kepada klien, kelola harga standar, durasi pengerjaan, dan status ketersediaan.','',btn('Export Katalog',0,"csv('katalog',[['Layanan','Kategori','Harga Min','Harga Max','Durasi','Aktif'],...DB.services.map(s=>[s.name,s.cat,s.min*1000,s.max*1000,s.days,s.active?'Ya':'Tidak'])])")+btn('+ Tambah Paket Jasa',1,'form()'),`<div id="st"></div><div class="${card} flex gap-2 text-xs mb-5 items-center"><span id="tabs" class="flex gap-2"></span>${srch('Cari jasa, software...','')}<select onchange="S.st=this.value;R()" class="bg-indigo-50/60 rounded-xl px-3 py-2.5 font-semibold outline-none"><option value="">Semua Status</option><option>Aktif</option><option>Nonaktif</option></select><select onchange="S.sort=this.value;R()" class="bg-indigo-50/60 rounded-xl px-3 py-2.5 font-semibold outline-none"><option>Terpopuler</option><option>Harga Terendah</option><option>Nama A-Z</option></select></div><div id="out"></div>`);
const cnt=c=>act().filter(o=>o.cat==c).length,tot=c=>DB.orders.filter(o=>o.cat==c).length;
function tg(id){const s=DB.services.find(x=>x.id==id);s.active=!s.active;addLog('Layanan '+s.name+(s.active?' diaktifkan.':' dinonaktifkan.'),'Katalog Jasa');save();R()}
function form(id){const s=DB.services.find(x=>x.id==id)||{name:'',cat:CATS[0],min:150,max:350,unit:'/ project',days:'3 – 5 Hari Kerja',sw:'',lead:DB.designers[0].name,desc:''};modal(id?'Edit Paket Jasa':'Tambah Paket Jasa',fld('k1','Nama Paket',s.name)+fld('k2','Kategori',s.cat,CATS)+`<div class="grid grid-cols-2 gap-3">${fld('k3','Harga Min (ribu Rp)',s.min,'number')}${fld('k4','Harga Max (ribu Rp)',s.max,'number')}</div>`+fld('k5','Estimasi Durasi',s.days)+fld('k6','Software',s.sw)+fld('k7','Lead Designer',s.lead,DB.designers.map(d=>d.name))+fld('k8','Deskripsi',s.desc,'area'),{ok:'Simpan Paket',onOk(){if(!g('k1')){toast('Nama paket wajib diisi');return false}const v={name:g('k1'),cat:g('k2'),min:+g('k3'),max:+g('k4'),days:g('k5'),sw:g('k6'),lead:g('k7'),desc:g('k8')};if(id)Object.assign(s,v);else DB.services.unshift({id:Date.now(),unit:'/ project',active:true,...v});addLog('Paket '+v.name+(id?' diperbarui.':' ditambahkan.'),'Katalog Jasa');save();toast('Paket jasa disimpan');R()}})}
function det(id){const s=DB.services.find(x=>x.id==id);modal(s.name,`<p class="text-slate-600">${s.desc}</p><div class="grid grid-cols-2 gap-3"><div class="bg-indigo-50/60 rounded-xl p-3"><b>Harga</b><br>Rp ${s.min}k – ${s.max}k ${s.unit}</div><div class="bg-indigo-50/60 rounded-xl p-3"><b>Durasi</b><br>${s.days}</div><div class="bg-indigo-50/60 rounded-xl p-3"><b>Software</b><br>${s.sw}</div><div class="bg-indigo-50/60 rounded-xl p-3"><b>Lead Designer</b><br>${s.lead}</div></div><a href="../layanan.html?s=${SL[s.cat]}" target="_blank" class="font-bold text-brand">Lihat di halaman customer ↗</a>`)}
function R(){const A=DB.services,L=A.filter(s=>(!S.c||s.cat==S.c)&&(!S.st||(S.st=='Aktif')==s.active)&&(s.name+s.sw+s.cat).toLowerCase().includes(S.q.toLowerCase())).sort((a,b)=>S.sort=='Harga Terendah'?a.min-b.min:S.sort=='Nama A-Z'?a.name.localeCompare(b.name):tot(b.cat)-tot(a.cat)),ao=DB.orders,cap=DB.designers.reduce((s,d)=>s+d.cap,0),top=[...CATS].sort((a,b)=>tot(b)-tot(a))[0];
$('st').innerHTML=stats([['TOTAL LAYANAN AKTIF',A.filter(s=>s.active).length+' Layanan','Tersebar di '+new Set(A.map(s=>s.cat)).size+' kategori utama','layers'],['LAYANAN TERPOPULER',top,tot(top)+' order tercatat','auto_awesome'],['RATA-RATA NILAI ORDER',rp(Math.round(ao.reduce((s,o)=>s+o.amount,0)/Math.max(1,ao.length))),'Dari '+ao.length+' order','payments'],['KAPASITAS DESAINER',Math.round(act().filter(o=>o.designer).length/cap*100)+'% Terpakai','Slot aktif / total slot','donut_large']]);
$('tabs').innerHTML=['',...CATS].map(c=>`<button onclick="S.c='${c}';R()" class="rounded-xl px-3 py-2.5 font-bold whitespace-nowrap ${S.c==c?'bg-brand text-white':'bg-indigo-50'}">${c||'Semua ('+A.length+')'}</button>`).join('');
$('out').innerHTML=`<div class="grid grid-cols-3 gap-5">${L.map(s=>`<div class="${card} !p-0 overflow-hidden ${s.active?'':'opacity-60'}"><div class="h-32 bg-gradient-to-br ${GR[s.id%6]} text-white p-3 flex flex-col justify-between"><div class="flex justify-between text-[10px] font-bold"><span class="bg-white/90 text-ink rounded-md px-2 py-0.5">${s.cat}</span><span class="${s.active?'bg-emerald-300 text-emerald-900':'bg-slate-300 text-slate-700'} rounded-md px-2 py-0.5">${s.active?'Aktif':'Nonaktif'}</span></div><div class="flex justify-between items-end"><b class="text-lg">Rp ${s.min}k – ${s.max}k</b><span class="text-[10px]">${s.unit}</span></div></div><div class="p-4"><b class="text-sm">${s.name}</b><div class="bg-indigo-50/60 rounded-xl p-2.5 mt-3 grid grid-cols-2 text-[10px]"><span>Estimasi Durasi<br><b>${s.days}</b></span><span>Order Aktif Kategori<br><b>${cnt(s.cat)} Project</b></span></div><p class="text-[11px] mt-2">Software: <b>${s.sw}</b></p><div class="flex justify-between items-center mt-1"><span class="text-[11px]">Lead: <b>${s.lead}</b></span><button onclick="tg(${s.id})" class="w-10 h-6 rounded-full relative ${s.active?'bg-emerald-600':'bg-slate-300'}"><i class="absolute top-1 w-4 h-4 rounded-full bg-white ${s.active?'right-1':'left-1'}"></i></button></div><div class="grid grid-cols-2 gap-2 mt-3 text-[11px] font-bold"><button onclick="det(${s.id})" class="bg-indigo-50 rounded-lg py-2">Detail</button><button onclick="form(${s.id})" class="bg-indigo-50 rounded-lg py-2">Edit Paket</button></div></div></div>`).join('')||'<p class="col-span-3 text-center text-slate-500">Paket tidak ditemukan.</p>'}</div><div class="${card} mt-5"><h2 class="font-bold text-base">Kapasitas Slot Mingguan</h2><div class="grid grid-cols-4 gap-4 mt-3 text-[11px]">${CATS.map(c=>{const cp=DB.designers.filter(d=>d.cat==c).reduce((s,d)=>s+d.cap,0),n=cnt(c),p=Math.min(100,Math.round(n/Math.max(1,cp)*100));return`<div><div class="flex justify-between"><b>${c}</b><b>${n}/${cp} (${p}%)</b></div><div class="h-2 bg-indigo-100 rounded-full mt-1"><div class="h-2 rounded-full ${p>=100?'bg-red-600':'bg-brand2'}" style="width:${p}%"></div></div></div>`}).join('')}</div></div>`}
S.q='';document.querySelector('input').oninput=e=>{S.q=e.target.value;R()};
$('out')&&R();
</script></body></html>

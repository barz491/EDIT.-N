<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan - KreatifDKV Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="../assets/tw.js"></script><link rel="stylesheet" href="../assets/style.css"></head><body><script src="../assets/app.js"></script><script>

let S={per:'',tab:'all'};const BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep*'],BV=[6.2,7.4,8.1,9.6,8.9,10.4,12.3,12.1];
shell('Laporan','Laporan Bisnis & Kinerja Penjualan Jasa','Rekap ringkas omset pendapatan, pembagian komisi designer, performa kategori jasa, dan ekspor laporan berkala studio DKV.','','<select onchange="S.per=this.value;R()" class="bg-white shadow-sm rounded-xl px-4 py-2.5 outline-none"><option value="">Semua Periode</option><option value="2026-09">September 2026</option><option value="2026-10">Oktober 2026</option></select>'+btn('Download PDF',0,'print()')+btn('Export Excel (.xlsx)',1,'expL()'),'<div id="out"></div>');
const rows=()=>{const os=DB.orders.filter(o=>!S.per||o.deadline.startsWith(S.per));return CATS.map((c,i)=>{const x=os.filter(o=>o.cat==c),om=x.reduce((s,o)=>s+o.amount,0);return{id:'#LAP-2026-'+String(i+1).padStart(2,'0'),c,n:x.length,om,dz:Math.round(om*DB.set.split/100),ks:om-Math.round(om*DB.set.split/100),done:x.every(o=>o.status=='Selesai')}})};
const expL=()=>csv('laporan',[['ID','Kategori','Jumlah Order','Omset','Designer','Kas Studio'],...rows().map(r=>[r.id,r.c,r.n,r.om,r.dz,r.ks])]);
function R(){const rs=rows(),om=rs.reduce((s,r)=>s+r.om,0),dz=rs.reduce((s,r)=>s+r.dz,0),os=DB.orders.filter(o=>(!S.per||o.deadline.startsWith(S.per))&&o.status=='Selesai').length,bv=[...BV,om/1e6],mx=Math.max(...bv),top=[...rs].sort((a,b)=>b.om-a.om)[0],tb=S.tab=='komisi'?[...rs].sort((a,b)=>b.dz-a.dz):S.tab=='profit'?[...rs].sort((a,b)=>b.ks-a.ks):rs;
$('out').innerHTML=stats([['TOTAL OMSET PENDAPATAN',rp(om),'Dari '+DB.orders.length+' order tercatat','payments'],['HAK KOMISI DESIGNER ('+DB.set.split+'%)',rp(dz),'Pembayaran komisi dilakukan di luar sistem.','account_balance_wallet'],['KAS STUDIO ('+(100-DB.set.split)+'%)',rp(om-dz),'Untuk operasional, lisensi & utilitas studio','savings'],['PESANAN SELESAI',os+' Pesanan','Final file sudah diserahkan','task_alt']])+`<div class="grid grid-cols-[1fr_320px] gap-5"><div class="${card}"><b class="text-base">Tren Pendapatan & Hak Komisi Bulanan</b><p class="text-[11px] text-slate-500">Bulan berjalan dihitung langsung dari data order.</p><div class="flex items-end gap-4 h-56 mt-6">${bv.map((v,i)=>`<div class="flex-1 text-center text-[10px] ${i==8?'font-bold text-brand':'text-slate-500'}">${i==8?v.toFixed(2):''}<div class="flex flex-col justify-end h-44 rounded-md overflow-hidden"><div class="${i==8?'bg-brand':'bg-indigo-100'}" style="height:${v/mx*70}%"></div><div class="${i==8?'bg-indigo-200':'bg-indigo-200'} mt-px" style="height:${v/mx*30}%"></div></div>${BL[i]}</div>`).join('')}</div></div>
<div class="${card}"><b class="text-base">Performa per Kategori Jasa</b><div class="bg-indigo-50 rounded-xl p-3 mt-3 text-[11px]"><b>KATEGORI TERLARIS</b><br>${top.c} (${top.n} Order)</div>${rs.map(r=>`<div class="mt-3 text-[11px]"><div class="flex justify-between"><b>${r.c}</b><b>${rp(r.om)} (${om?Math.round(r.om/om*100):0}%)</b></div><div class="h-2 bg-indigo-100 rounded-full mt-1"><div class="h-2 rounded-full bg-brand2" style="width:${om?r.om/om*100:0}%"></div></div><span class="text-slate-500">${r.n} Proyek dikerjakan</span></div>`).join('')}</div></div>
<div class="${card} mt-5"><div class="flex justify-between"><b class="text-base">Rincian Rekap Finansial & Hak Komisi per Kategori</b><span class="flex gap-1 text-xs font-bold">${[['all','Semua Kategori'],['profit','Paling Menguntungkan'],['komisi','Komisi Terbanyak']].map(([k,t])=>`<button onclick="S.tab='${k}';R()" class="rounded-lg px-3 py-2 ${S.tab==k?'bg-brand text-white':'bg-indigo-50'}">${t}</button>`).join('')}</span></div>${table(['ID / PERIODE','KATEGORI LAYANAN','JUMLAH ORDER','TOTAL OMSET','ALOKASI DESIGNER','KAS STUDIO','STATUS KOMISI'],tb.map(r=>[`<b class="font-mono text-brand">${r.id}</b>`,r.c,pill(r.n+' Proyek'),rp(r.om),`<b class="text-emerald-700">${rp(r.dz)}</b>`,rp(r.ks),pill(r.done?'Hak Komisi Tercatat':'Dalam Rekapitulasi',r.done?'bg-emerald-200 text-emerald-900':'bg-indigo-100 text-brand')]))}<div class="flex justify-end mt-3"><button onclick="print()" class="bg-indigo-50 rounded-xl px-4 py-2.5 text-xs font-bold">${I('print')} Cetak Laporan Lengkap Bulan Ini</button></div></div>`}
$('out')&&R();
</script></body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin & Guru - KreatifDKV Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="../assets/tw.js"></script><link rel="stylesheet" href="../assets/style.css"></head>
<body class="min-h-screen flex flex-col"><header class="flex justify-between items-center px-14 pt-9 text-xs font-semibold text-slate-600"><a href="../index.html" class="flex items-center gap-2"><i class="m">arrow_back</i>Kembali ke Beranda Utama</a><span class="bg-indigo-50 text-brand rounded-full px-3 py-1.5">Portal Akses Internal</span></header>
<main class="flex-1 grid place-items-center py-10"><div class="bg-white w-[360px] rounded-2xl shadow-xl shadow-indigo-100 p-8 text-center">
<div class="w-11 h-11 mx-auto rounded-xl bg-indigo-100 text-brand grid place-items-center"><i class="m">draw</i></div><div class="mt-3 font-extrabold">KreatifDKV <span class="text-[10px] text-brand">STUDIO</span></div>
<h1 class="mt-4 text-xl font-extrabold">Masuk ke Dashboard Admin</h1><p class="text-[13px] text-slate-500 mt-2">Kelola request, pesanan, pembayaran, designer, dan project.</p>
<div class="text-left mt-5"><label class="text-xs font-bold">Email / ID Admin</label><div class="mt-2 mb-4 flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-3"><i class="m text-slate-500">badge</i><input id="em"  class="bg-transparent text-xs w-full outline-none"></div>
<div class="flex justify-between"><label class="text-xs font-bold">Kata Sandi</label><button onclick="lupa()" class="text-[11px] font-bold text-brand">Lupa kata sandi?</button></div>
<div class="mt-2 mb-3 flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-3"><i class="m text-slate-500">lock</i><input id="pw" type="password" value="admin123" onkeydown="if(event.key=='Enter')masuk()" class="bg-transparent text-xs w-full outline-none"><i class="m cursor-pointer" onclick="pw.type=pw.type=='password'?'text':'password'">visibility</i></div>
<p id="err" class="hidden text-[11px] text-red-600 font-semibold mb-2">Email/ID atau kata sandi salah.</p>
<button onclick="masuk()" class="mt-2 w-full bg-brand text-white font-bold text-sm rounded-xl py-3 shadow-lg shadow-indigo-200">Masuk ke Dashboard Admin →</button> 
<p class="text-[10px] text-slate-400 text-center mt-3"></p></div>
<p class="text-[11px] mt-5">Kendala login? <button class="text-brand font-semibold" onclick="wa('Halo Supervisor, saya kendala login admin.')">Hubungi Supervisor Studio</button></p></div></main>
<footer class="text-center text-[11px] font-medium text-slate-600 pb-10">© 2026 KreatifDKV Studio. Platform Manajemen Jasa Kreatif.</footer>
<script src="../assets/app.js"></script><script>
function masuk(){const e=$('em').value.trim().toLowerCase();if((e=='admin@kreatifdkv.com'||e=='admin')&&$('pw').value=='DKVhebat123'){sessionStorage.adm='1';location='dashboard.html'}else $('err').classList.remove('hidden')}
function lupa(){modal('Lupa Kata Sandi','<p>Reset kata sandi dilakukan oleh Supervisor Studio. Hubungi supervisor via WhatsApp untuk permintaan reset.</p>',{ok:'Hubungi Supervisor',onOk(){wa('Halo Supervisor, mohon reset kata sandi admin.')}})}
if(sessionStorage.adm)location='dashboard.html';
</script></body></html>

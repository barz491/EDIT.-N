<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembayaran - KreatifDKV Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="../assets/tw.js"></script><link rel="stylesheet" href="../assets/style.css"></head><body><script src="../assets/app.js"></script><script>

let S={q:QS('q'),m:'',tab:'all',pg:1};const PER=6,PS=['Menunggu Pembayaran','Dalam Verifikasi','Bukti Diterima','DP Terverifikasi','Lunas'],CH=['BCA Transfer','Mandiri Transfer','Bank BCA','QRIS Studio'];
shell('Pembayaran','Kelola Pembayaran & Transaksi','Pantau uang muka (DP 50%), pelunasan pesanan selesai, dan riwayat pembayaran jasa kreatif Customer.','Verifikasi Manual via WhatsApp',btn('Export Rekap (Excel)',0,'expP()')+btn('+ Catat Pembayaran Manual',1,'catat()'),`<div id="st"></div><div class="${card}"><div class="flex gap-2 mb-3 text-xs items-center"><span id="tabs" class="flex gap-2"></span>${srch('Cari Order ID, customer...',S.q)}${sel('m','Metode: Semua Kanal',CH)}</div><div id="out"></div></div><div id="inf"></div>`);
const fl=()=>DB.payments.filter(p=>(S.tab=='all'||p.status=='Menunggu Pembayaran')&&(!S.m||p.channel==S.m)&&(p.order+p.client+p.svc).toLowerCase().includes(S.q.toLowerCase()));
const expP=()=>csv('pembayaran',[['ID','Order','Klien','Jasa','Tipe','Nominal','Kanal','Status','Waktu'],...fl().map(p=>[p.id,p.order,p.client,p.svc,p.type,p.amount,p.channel,p.status,p.time])]);
function eff(p){const o=DB.orders.find(x=>x.id==p.order);if(!o)return;if(p.status=='Lunas')o.pay='Lunas';else if(p.status=='DP Terverifikasi'){o.pay='DP 50%';if(o.status=='Menunggu DP')o.status='Sedang Dikerjakan'}}
function editP(id){const p=DB.payments.find(x=>x.id==id);modal('Verifikasi Pembayaran '+p.order,`<p class="text-slate-600"><b>${p.client}</b> • ${p.svc}<br>${p.type} • ${rp(p.amount)} • ${p.channel}</p>${fld('v1','Status Pembayaran',p.status,PS)}<p class="text-slate-500">Mengubah status menjadi DP Terverifikasi / Lunas otomatis memperbarui status pembayaran order dan terlihat oleh customer.</p>`,{ok:'Simpan Status',onOk(){p.status=g('v1');eff(p);addLog('Pembayaran '+p.order+' → '+p.status+'.','Verifikasi Pembayaran');save();toast('Status pembayaran diperbarui');R()}})}
function catat(){modal('Catat Pembayaran Manual',fld('c1','Pilih Order',DB.orders[0].id+' — '+DB.orders[0].cust,DB.orders.map(o=>o.id+' — '+o.cust))+fld('c2','Tipe Pembayaran','DP 50%',['DP 50%','Pelunasan 50%','Pelunasan Penuh'])+fld('c3','Nominal (Rp)',100000,'number')+fld('c4','Kanal',CH[0],CH)+fld('c5','Status','Dalam Verifikasi',PS),{ok:'Catat Pembayaran',onOk(){const o=DB.orders.find(x=>x.id==g('c1').split(' — ')[0]);if(!(+g('c3')>0)){toast('Nominal harus lebih dari 0');return false}const p={id:'PAY-'+Date.now().toString().slice(-6),order:o.id,client:o.cust,svc:o.svc,type:g('c2'),amount:+g('c3'),channel:g('c4'),status:g('c5'),time:new Date().toISOString().slice(0,16)};DB.payments.unshift(p);eff(p);addLog('Pembayaran '+rp(p.amount)+' dicatat untuk '+o.id+'.','Catat Manual');save();toast('Pembayaran dicatat');R()}})}
function qr(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;let s='';for(let y=0;y<25;y++)for(let x=0;x<25;x++){const f=(x<7&&y<7)||(x>17&&y<7)||(x<7&&y>17);h=(h*1103515245+12345)>>>0;if(f?(x%6==0||y%6==0||x==18||x==24||y==18||y==24||(x%6>1&&x%6<5&&y%6>1&&y%6<5)):(h>>16)&1)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return`<svg viewBox="0 0 25 25" class="w-48 mx-auto">${s}</svg>`}
function R(){const D=DB.payments,sm=s=>D.filter(p=>s.includes(p.status)).reduce((a,p)=>a+p.amount,0),cn=s=>D.filter(p=>s.includes(p.status)).length,L=fl(),T=Math.max(1,Math.ceil(L.length/PER));S.pg=Math.min(S.pg,T);const Pg=L.slice((S.pg-1)*PER,S.pg*PER);
$('st').innerHTML=stats([['TERVERIFIKASI',rp(sm(['DP Terverifikasi','Lunas'])),cn(['DP Terverifikasi','Lunas'])+' transaksi terverifikasi','verified'],['VERIFIKASI PENDING',rp(sm(['Dalam Verifikasi','Bukti Diterima'])),cn(['Dalam Verifikasi','Bukti Diterima'])+' transaksi perlu cek transfer','pending_actions'],['MENUNGGU PEMBAYARAN',rp(sm(['Menunggu Pembayaran'])),cn(['Menunggu Pembayaran'])+' tagihan belum masuk','hourglass_top'],['LUNAS PENUH',rp(sm(['Lunas'])),cn(['Lunas'])+' pesanan tuntas','task_alt','text-emerald-700']]);
$('tabs').innerHTML=`<button onclick="S.tab='all';S.pg=1;R()" class="rounded-xl px-4 py-2.5 font-bold ${S.tab=='all'?'bg-brand text-white':'bg-indigo-50'}">Semua Transaksi (${D.length})</button><button onclick="S.tab='wait';S.pg=1;R()" class="rounded-xl px-4 py-2.5 font-bold ${S.tab=='wait'?'bg-brand text-white':'bg-indigo-50'}">Menunggu Pembayaran (${cn(['Menunggu Pembayaran'])})</button>`;
$('out').innerHTML=table(['ORDER ID','KLIEN / DETAIL JASA','TIPE','NOMINAL & KANAL','STATUS & WAKTU'],Pg.map(p=>[`<b class="text-brand text-sm">${p.order}</b>`,`<b>${p.client}</b><br>${p.svc}`,pill(p.type),`<b>${rp(p.amount)}</b><br>${p.channel}`,sp(p.status)+'<br><span class="text-slate-500">'+fd(p.time)+', '+p.time.slice(11)+'</span>']),Pg.map(p=>`editP('${p.id}')`))+pager(L.length,S.pg,PER);
$('inf').innerHTML=`<div class="grid grid-cols-[1fr_280px] gap-5 mt-5"><div class="${card}"><h2 class="font-bold text-base">Metode Pembayaran yang Dikonfirmasi via WhatsApp</h2><div class="grid grid-cols-3 gap-3 mt-4 text-[11px]">${DB.set.bank.map((b,i)=>`<div class="bg-indigo-50/60 rounded-xl p-3"><b class="text-brand">${b.n}</b><div class="font-bold text-sm my-2">${b.no}</div>a.n. ${b.an}<br>${b.n.startsWith('QRIS')?`<button onclick="modal('QRIS ${b.no}',qr('${b.no}')+'<p class=text-center text-slate-500>Contoh tampilan QR statis. Pasang QR asli di Pengaturan.</p>')" class="mt-2 font-bold text-emerald-800">Buka QR Code</button>`:`<button onclick="cp('${b.no}')" class="mt-2 font-bold text-brand">Salin Rekening</button>`}</div>`).join('')}</div><div class="flex justify-between items-center mt-4 text-[11px] border-t pt-3"><span>Pembayaran diverifikasi manual oleh Admin setelah customer mengirim bukti via WhatsApp.</span><button onclick="wa('Halo Admin KreatifDKV, saya ingin konfirmasi pembayaran.')" class="font-bold text-brand">Hubungi Admin via WhatsApp</button></div></div><div class="${card} bg-indigo-50/60"><h2 class="font-bold text-base">SOP Keuangan Studio</h2>${['DP Minimal '+DB.set.dp+'%: Pekerjaan desain dimulai setelah DP terverifikasi di kas.','Preview Ber-watermark: Revisi hanya dikirim dalam watermark resmi studio.','File Master Bersih: Source file HANYA dikirim setelah lunas 100% tervalidasi.'].map((t,i)=>`<p class="text-[11px] mt-3"><b class="inline-grid place-items-center w-5 h-5 rounded-full bg-brand text-white mr-2">${i+1}</b>${t}</p>`).join('')}</div></div>`}
$('out')&&R();
</script></body></html>

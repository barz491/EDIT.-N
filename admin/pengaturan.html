<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan - KreatifDKV Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="../assets/tw.js"></script><link rel="stylesheet" href="../assets/style.css"></head><body><script src="../assets/app.js"></script><script>

let d=JSON.parse(JSON.stringify(DB.set));
const inp=(l,k,t='text')=>`<label class="block mt-3 text-[10px] font-bold text-slate-500 tracking-wide">${l}<input type="${t}" value="${esc(d[k])}" oninput="d.${k}=${t=='number'?'+':''}this.value" class="${IC} text-[12px] text-ink"></label>`;
const go=id=>$(id).scrollIntoView({behavior:'smooth'});
shell('Pengaturan','Pengaturan Studio & Operasional Bisnis DKV','Konfigurasi identitas studio, skema komisi designer (70/30), rekening kas manual resmi, komunikasi WhatsApp Admin, dan hak akses tim studio.','Konfigurasi Sentral Studio',btn('Batal',0,'location.reload()')+btn('Simpan Perubahan',1,'sv()'),`<div class="flex gap-2 text-xs my-5">${[['s1','Profil & Identitas Studio'],['s2','Skema Komisi & Finansial'],['s3','Rekening & Pembayaran'],['s4','Komunikasi WhatsApp']].map(([i,t],n)=>`<button onclick="go('${i}')" class="rounded-xl px-4 py-2.5 font-bold ${n?'bg-white shadow-sm':'bg-brand text-white'}">${t}</button>`).join('')}</div><div id="out"></div>`);
function sv(){DB.set=JSON.parse(JSON.stringify(d));addLog('Pengaturan studio disimpan oleh Budi Santoso.','Pengaturan');save();toast('Pengaturan berhasil disimpan');sidebar('Pengaturan');R()}
function rs(){$('rs').innerHTML=`<div class="flex justify-between text-[11px] font-bold mt-4"><span class="text-brand">● ${d.split}% Hak Desainer</span><span class="text-emerald-700">● ${100-d.split}% Kas Studio</span></div><div class="h-3 rounded-full mt-1 overflow-hidden flex"><div class="bg-brand2" style="width:${d.split}%"></div><div class="bg-emerald-700" style="width:${100-d.split}%"></div></div>`}
function rb(){$('rb').innerHTML=d.bank.map((b,i)=>`<div class="bg-indigo-50/60 rounded-xl p-3 text-[11px]"><div class="flex justify-between"><b class="text-brand">${b.n}</b><span class="flex gap-2"><button onclick="eb(${i})">${I('edit')}</button><button onclick="d.bank.splice(${i},1);rb()">${I('delete')}</button></span></div><div class="font-bold text-[13px] my-1">${b.no}</div>a.n. ${b.an}<br><b class="text-emerald-700">${b.t}</b></div>`).join('')}
function eb(i){const b=i>=0?d.bank[i]:{n:'',no:'',an:'KreatifDKV Studio',t:'Transfer Manual'};modal(i>=0?'Edit Akun':'Tambah Akun Pembayaran',fld('b1','Nama Bank / Metode',b.n)+fld('b2','Nomor Rekening / NMID',b.no)+fld('b3','Atas Nama',b.an)+fld('b4','Keterangan',b.t),{ok:'Simpan',onOk(){if(!g('b1')||!g('b2')){toast('Nama dan nomor wajib diisi');return false}const v={n:g('b1').toUpperCase(),no:g('b2'),an:g('b3'),t:g('b4')};if(i>=0)d.bank[i]=v;else d.bank.push(v);rb();toast('Akun diperbarui — klik Simpan Perubahan')}})}
const TG=[['Konfirmasi Penerimaan Form Brief','Admin menyapa klien dan mengonfirmasi brief melalui WhatsApp.'],['Pemberian Info Rekening & QRIS DP / Pelunasan','Admin memberikan informasi pembayaran secara manual melalui WhatsApp.'],['Update Milestone & Preview Karya','Admin mengabari progres dan mengirimkan tautan preview karya.'],['Konfirmasi Penugasan Designer','Admin mengonfirmasi penugasan secara manual kepada Designer.']];
function rt(){$('rt').innerHTML=TG.map((t,i)=>`<div class="flex justify-between items-center gap-4 mt-3"><div><b class="text-[12px]">${t[0]}</b><p class="text-[11px] text-slate-500">${t[1]}</p></div><button onclick="d.tg[${i}]=d.tg[${i}]?0:1;rt()" class="w-10 h-6 rounded-full relative shrink-0 ${d.tg[i]?'bg-brand2':'bg-slate-300'}"><i class="absolute top-1 w-4 h-4 rounded-full bg-white ${d.tg[i]?'right-1':'left-1'}"></i></button></div>`).join('')}
function rl(){$('rl').innerHTML=d.logo?`<img src="${d.logo}" class="max-h-16">`:`<span class="text-slate-400 text-[11px]">Belum ada logo</span>`}
function up(f){const r=new FileReader();r.onload=()=>{d.logo=r.result;rl();toast('Logo dimuat — klik Simpan Perubahan')};f&&r.readAsDataURL(f)}
function R(){$('out').innerHTML=`<div class="grid grid-cols-2 gap-5"><div class="space-y-5"><div id="s1" class="${card}"><b class="text-base">Logo & Media Brand</b><div class="bg-indigo-50/60 rounded-xl p-4 mt-3 text-[11px] flex gap-4 items-center"><div id="rl" class="w-32 h-20 bg-white rounded-xl grid place-items-center"></div><div><b>Logo Utama</b><br>Format SVG/PNG transparan min. 400×120px.<br><input id="lf" type="file" accept="image/*" hidden onchange="up(this.files[0])"><button onclick="lf.click()" class="mt-2 bg-white rounded-lg px-3 py-1.5 font-bold">Unggah Logo Baru</button> <button onclick="d.logo='';rl()" class="px-2">${I('delete')}</button></div></div></div>
<div class="${card}"><b class="text-base">Identitas Resmi Studio</b>${inp('NAMA STUDIO / UNIT BISNIS','name')}${inp('SLOGAN / TAGLINE BRAND','slogan')}<label class="block mt-3 text-[10px] font-bold text-slate-500">DESKRIPSI SINGKAT<textarea rows="3" oninput="d.desc=this.value" class="${IC} text-[12px] text-ink">${d.desc}</textarea></label>${inp('KONTAK WHATSAPP CS','wa')}${inp('EMAIL RESMI','email')}${inp('ALAMAT STUDIO','addr')}${inp('JAM OPERASIONAL PELAYANAN','hours')}</div></div>
<div class="space-y-5"><div id="s2" class="${card}"><b class="text-base">Skema Komisi Desainer & Kas Studio</b> ${pill('Model '+d.split+' / '+(100-d.split))}<input type="range" min="50" max="90" value="${d.split}" oninput="d.split=+this.value;rs()" class="w-full mt-4"><div id="rs"></div><div class="grid grid-cols-2 gap-3 mt-4">${inp('UANG MUKA MINIMAL (%)','dp','number')}<label class="block mt-3 text-[10px] font-bold text-slate-500">BATAS REVISI<select onchange="d.rev=this.value" class="${IC} text-[12px] text-ink">${['1× Revisi Minor','2× Revisi Minor (Rekomendasi Studio)','3× Revisi Minor'].map(x=>`<option ${x==d.rev?'selected':''}>${x}</option>`).join('')}</select></label></div></div>
<div id="s4" class="${card}"><b class="text-base">Komunikasi WhatsApp Admin</b><div class="bg-indigo-50/60 rounded-xl p-3 mt-3 flex justify-between items-center text-[12px] font-bold"><span>${d.wa}</span><button onclick="wa('Halo Admin KreatifDKV')" class="bg-white rounded-lg px-3 py-1.5 text-[11px]">Buka WhatsApp Admin</button></div><div id="rt"></div></div>
<div id="s3" class="${card}"><div class="flex justify-between"><b class="text-base">Informasi Metode Pembayaran</b><button onclick="eb(-1)" class="text-[11px] font-bold text-brand">+ Tambah Akun</button></div><div id="rb" class="grid grid-cols-3 gap-2 mt-3"></div></div></div></div>
<div class="${card} flex justify-between items-center mt-5"><div><b>Status Penyimpanan Pengaturan</b><p class="text-[11px] text-slate-500">Perubahan baru tersimpan setelah klik Simpan Semua Pengaturan.</p></div><div class="flex gap-2 text-xs font-bold">${btn('Reset ke Default Studio',0,"if(confirm('Kembalikan pengaturan ke default?')){DB.set=JSON.parse(JSON.stringify(SEED.set));save();location.reload()}")}${btn('Simpan Semua Pengaturan',1,'sv()')}</div></div>`;rl();rs();rb();rt()}
$('out')&&R();
</script></body></html>

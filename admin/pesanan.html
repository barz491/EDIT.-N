<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesanan - KreatifDKV Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="../assets/tw.js"></script><link rel="stylesheet" href="../assets/style.css"></head><body><script src="../assets/app.js"></script><script>

let S={q:QS('q'),cat:'',pay:'',st:'',pg:1};const PER=6,STS=['Menunggu DP','Sedang Dikerjakan','Menunggu Review','Revisi','Selesai'],PYS=['Menunggu Pembayaran','DP 50%','Lunas'];
shell('Pesanan','Pesanan','Pantau dan kelola seluruh pesanan aktif, progres pengerjaan desainer, status pembayaran, serta deadline proyek studio.','',btn('Export Data',0,'expO()')+btn('+ Buat Pesanan Manual',1,'orderForm()'),`<div id="st"></div><div class="${card} flex gap-3 mb-5">${srch('Cari ID pesanan, nama customer, atau layanan...',S.q)}${sel('cat','Semua Kategori',CATS)}${sel('pay','Semua Pembayaran',PYS)}${sel('st','Semua Status',STS)}</div><div id="out"></div>`);
const fl=()=>DB.orders.filter(o=>(!S.cat||o.cat==S.cat)&&(!S.pay||o.pay==S.pay)&&(!S.st||o.status==S.st)&&(o.id+o.cust+o.svc+o.designer).toLowerCase().includes(S.q.toLowerCase()));
const expO=()=>csv('pesanan',[['ID','Customer','Layanan','Designer','Pembayaran','Status','Progress','Deadline','Nilai'],...fl().map(o=>[o.id,o.cust,o.svc,o.designer,o.pay,o.status,o.progress+'%',o.deadline,o.amount])]);
function editO(id){const o=DB.orders.find(x=>x.id==id);modal('Kelola Pesanan '+id,`<p class="text-slate-600">${o.cust} • ${o.svc}</p>${fld('p1','Designer',o.designer||'Menunggu Designer',['Menunggu Designer',...DB.designers.map(d=>d.name)])}${fld('p2','Status Order',o.status,STS)}${fld('p3','Status Pembayaran',o.pay,PYS)}<label class="block font-bold">Progress: <span id="pv">${o.progress}</span>%<input id="p4" type="range" min="0" max="100" value="${o.progress}" oninput="$('pv').textContent=this.value" class="w-full"></label>${fld('p5','Deadline',o.deadline,'date')}${fld('p6','Nilai Order (Rp)',o.amount,'number')}<div class="flex gap-4 font-bold text-brand"><a href="../lacak.html?id=${o.id}" target="_blank">Lihat sebagai customer ↗</a><button onclick="wa('Halo ${o.cust}, update pesanan ${o.id}','${o.wa}')">Chat WA</button></div>`,{ok:'Simpan Perubahan',onOk(){o.designer=g('p1')=='Menunggu Designer'?'':g('p1');o.status=g('p2');o.pay=g('p3');o.progress=o.status=='Selesai'?100:+g('p4');o.deadline=g('p5');o.amount=+g('p6');addLog(id+' diperbarui: '+o.status+' ('+o.progress+'%).','Update Pesanan');save();toast(id+' berhasil diperbarui');R()}})}
function R(){const A=DB.orders,L=fl(),T=Math.max(1,Math.ceil(L.length/PER));S.pg=Math.min(S.pg,T);const Pg=L.slice((S.pg-1)*PER,S.pg*PER),n=s=>A.filter(o=>o.status==s).length;
$('st').innerHTML=stats([['TOTAL PESANAN',A.length,A.length+' Pesanan • Aktif & Terdata','shopping_bag'],['SEDANG DIKERJAKAN',n('Sedang Dikerjakan'),'Proyek • Tim Desainer DKV','group'],['MENUNGGU REVIEW / REVISI',n('Menunggu Review')+n('Revisi'),'Proyek • Menunggu konfirmasi klien','rate_review'],['SELESAI & ARSIP',n('Selesai'),'Proyek • Final file diserahkan','check_circle','text-emerald-700']]);
$('out').innerHTML=`<div class="${card}">${table(['ORDER ID','CUSTOMER','LAYANAN','DESIGNER','PEMBAYARAN','STATUS','PROGRESS','DEADLINE'],Pg.map(o=>[`<b class="text-brand">#${o.id}</b><br>${rp(o.amount)}`,`<b>${o.cust}</b><br>${o.wa}`,o.svc+'<br>'+pill(o.cat),o.designer||'<i class="text-slate-400">Menunggu Designer</i>',sp(o.pay),pill(o.status,SC[o.status]),`<b>${o.progress}%</b><div class="h-1.5 bg-indigo-100 rounded-full w-24"><div class="h-1.5 rounded-full bg-brand2" style="width:${o.progress}%"></div></div>`,fd(o.deadline)]),Pg.map(o=>`editO('${o.id}')`))}${pager(L.length,S.pg,PER)}</div><p class="text-[11px] text-slate-500 mt-3">Klik baris pesanan untuk mengubah designer, status, pembayaran, dan progress. Perubahan langsung terlihat di halaman Lacak Pesanan customer.</p>`}
$('out')&&R();
</script></body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Masuk - KreatifDKV Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="../assets/tw.js"></script><link rel="stylesheet" href="../assets/style.css"></head><body><script src="../assets/app.js"></script><script>

let S={q:QS('q'),st:'',cat:'',pg:1,sel:''};const PER=5;
shell('Request Masuk','Request Masuk','Kelola dan validasi permintaan layanan dari customer sebelum dibuat menjadi order resmi.','Pra-Order Studio',btn('Export Request',0,'expR()'),`<div id="st"></div><div class="${card} flex gap-3 mb-5">${srch('Cari nama customer, ID request, atau kata kunci...',S.q)}${sel('st','Semua Status',['Baru','Menunggu','Dikonversi','Ditolak','Diarsipkan'])}${sel('cat','Semua Kategori',CATS)}</div><div id="out"></div>`);
const fl=()=>DB.requests.filter(r=>(!S.st||r.status==S.st)&&(!S.cat||r.cat==S.cat)&&(r.id+r.name+r.svc+r.wa).toLowerCase().includes(S.q.toLowerCase()));
const expR=()=>csv('request',[['ID','Customer','WA','Layanan','Kategori','Tanggal','Status'],...fl().map(r=>[r.id,r.name,r.wa,r.svc,r.cat,r.date,r.status])]);
function setR(id,s,m){const r=DB.requests.find(x=>x.id==id);r.status=s;addLog('Request '+id+' '+m+'.','Request Masuk');save();toast('Request '+id+' '+m);R()}
function editR(id){const r=DB.requests.find(x=>x.id==id);modal('Edit Request '+id,fld('e1','Nama Customer',r.name)+fld('e2','WhatsApp',r.wa)+fld('e3','Layanan',r.svc)+fld('e4','Brief',r.brief,'area'),{ok:'Simpan',onOk(){r.name=g('e1');r.wa=g('e2');r.svc=g('e3');r.brief=g('e4');save();toast('Request diperbarui');R()}})}
function R(){const D=DB.requests,n=s=>D.filter(r=>r.status==s).length,L=fl(),T=Math.max(1,Math.ceil(L.length/PER));S.pg=Math.min(S.pg,T);const Pg=L.slice((S.pg-1)*PER,S.pg*PER),r=D.find(x=>x.id==S.sel)||Pg[0];
$('st').innerHTML=stats([['REQUEST BARU',n('Baru')+' Pengajuan','Butuh peninjauan awal','move_to_inbox'],['MENUNGGU KONFIRMASI',n('Menunggu')+' Request','Negosiasi / Chat WhatsApp','forum'],['DIKONVERSI JADI ORDER',n('Dikonversi')+' Order','Siap diterbitkan jadi order','task_alt','text-emerald-700'],['DITOLAK / DIARSIPKAN',(n('Ditolak')+n('Diarsipkan'))+' Request','Tidak sesuai lingkup / anggaran','archive']]);
$('out').innerHTML=`<div class="grid grid-cols-[1fr_310px] gap-5"><div class="${card}"><div class="font-bold mb-3">Daftar Request Customer ${pill(L.length+' Ditampilkan')}</div>${table(['REQUEST ID','CUSTOMER','LAYANAN & KATEGORI','TGL REQUEST','STATUS'],Pg.map(x=>[`<b class="text-brand">${x.id}</b>`,`<b>${x.name}</b><br>${x.wa}`,x.svc+'<br><span class="text-slate-500">'+x.cat+'</span>',fd(x.date),pill(x.status,SC[x.status])]),Pg.map(x=>`S.sel='${x.id}';R()`))}${pager(L.length,S.pg,PER)}</div>
${r?`<div class="${card}"><b class="text-brand text-lg">${r.id}</b> ${pill(r.status,SC[r.status])}<p class="text-[11px] text-slate-500 mt-1">Diajukan ${fd(r.date)}</p><div class="grid grid-cols-2 gap-2 mt-4 text-[11px]"><div class="bg-indigo-50/60 rounded-xl p-3"><b>DATA CUSTOMER</b><br>${r.name}<br>${r.wa}<br>${r.email}</div><div class="bg-indigo-50/60 rounded-xl p-3"><b>LAYANAN</b><br>${r.svc}<br>${r.cat}<br>Rekomendasi: ${r.rec||'-'}</div></div><div class="bg-indigo-50/60 rounded-xl p-3 mt-3 text-[11px]"><b>Brief Customer</b><p class="mt-2 leading-relaxed">${r.brief}</p></div><div class="flex gap-2 mt-3 text-[11px] font-bold"><button onclick="terima('${r.id}')" class="flex-1 bg-brand text-white rounded-xl py-2.5">Terima & Buat Order</button><button onclick="wa('Halo ${r.name}, kami dari KreatifDKV terkait ${r.id}','${r.wa}')" class="flex-1 bg-wa text-white rounded-xl py-2.5">Chat WhatsApp</button></div><div class="flex justify-between mt-3 text-[11px] text-slate-600 font-semibold"><button onclick="editR('${r.id}')">${I('edit')} Edit Request</button><button onclick="setR('${r.id}','Ditolak','ditolak')">${I('block')} Tolak Request</button><button onclick="setR('${r.id}','Diarsipkan','diarsipkan')">${I('inventory_2')} Arsipkan</button></div></div>`:`<div class="${card} text-slate-500 text-xs">Pilih request untuk melihat detail.</div>`}</div>`}
$('out')&&R();
</script></body></html>

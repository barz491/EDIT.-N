<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lacak Pesanan - KreatifDKV Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="assets/tw.js"></script><link rel="stylesheet" href="assets/style.css"></head><body class="text-[13px]"><main id="app"></main><script src="assets/app.js"></script><script>

const ST=['Brief & Analisis Kebutuhan Klien','Eksplorasi Konsep & Moodboard Visual','Pembuatan Desain & Layout / Produksi','Preview Hasil Karya','Sesi Revisi & Penyempurnaan Detail','Finalisasi File Siap Pakai','Serah Terima Master File & Selesai'];
let id=(QS('id')||'').toUpperCase();const cs=QS('s');if(!id&&cs){const o=DB.orders.find(x=>SL[x.cat]==cs);id=o?o.id:''}if(!id)id=DB.orders[0].id;
function cari(){const v=$('oid').value.trim().toUpperCase();if(DB.orders.some(o=>o.id==v))location='lacak.html?id='+v;else toast('Order ID tidak ditemukan. Contoh: '+DB.orders[0].id)}
function render(){const o=DB.orders.find(x=>x.id==id),tabs=CATS.map(c=>{const f=DB.orders.find(x=>x.cat==c);return`<a href="lacak.html?id=${f?f.id:''}" class="rounded-lg px-3 py-1.5 ${o&&o.cat==c?'bg-brand text-white':'bg-indigo-100 text-brand'}">${c}</a>`}).join('');
const top=`<div class="flex justify-between items-end"><div><p class="text-[11px] text-slate-500">Beranda › <b class="text-ink">Lacak Pesanan</b></p><h1 class="text-3xl font-extrabold mt-2">Lacak Pesanan</h1><p class="text-slate-500 text-xs">Pantau perkembangan project Anda secara transparan dan realtime.</p></div><div class="bg-white rounded-xl shadow-sm p-2 flex gap-2 items-center text-xs"># <input id="oid" value="${id}" onkeydown="if(event.key=='Enter')cari()" class="border rounded px-2 py-1.5 w-44"><button onclick="cari()" class="bg-brand text-white font-bold rounded-lg px-4 py-2">Lacak Pesanan</button></div></div><div class="flex gap-2 mt-4 text-[11px] font-bold">${tabs}</div>`;
if(!o){$('app').innerHTML=`<div class="max-w-5xl mx-auto px-4 pt-6">${top}<div class="bg-white rounded-2xl shadow-sm p-10 mt-5 text-center"><b class="text-lg">Order ID tidak ditemukan</b><p class="text-slate-500 mt-1">Periksa kembali ID yang diberikan admin via WhatsApp.</p></div></div>`}
else{const done=o.status=='Selesai',cur=done?8:Math.min(7,Math.floor(o.progress/100*7)+1),dp=Math.round(o.amount*DB.set.dp/100),pay=o.pay=='Lunas'?'Lunas ('+rp(o.amount)+')':o.pay=='DP 50%'?'DP '+DB.set.dp+'% Terverifikasi ('+rp(dp)+')':'Menunggu Pembayaran DP ('+rp(dp)+')',ls=DB.log.filter(l=>l.m.includes(o.id)).slice(0,4);
$('app').innerHTML=`<div class="max-w-5xl mx-auto px-4 pt-6">${top}<section class="bg-white rounded-2xl shadow-sm p-6 mt-5"><div class="flex justify-between"><div><span class="bg-indigo-100 text-brand font-extrabold text-lg rounded-lg px-3 py-1">${o.id}</span> <b class="text-base ml-2">${o.svc}</b><p class="text-[11px] text-slate-500 mt-1">${o.cust} • ${o.cat}</p></div><div class="flex gap-2 text-[11px] font-bold h-fit"><button onclick="wa('Halo Admin, saya ingin tanya pesanan ${o.id}')" class="bg-wa text-white rounded-lg px-4 py-2">Tanya WhatsApp</button><button onclick="print()" class="bg-indigo-50 rounded-lg px-4 py-2">Unduh Bukti PDF</button></div></div><div class="grid grid-cols-4 gap-4 mt-5 pt-4 border-t text-[11px]"><div><span class="text-slate-500">STATUS PENGERJAAN</span><br><b class="text-brand">● ${o.status}${done?'':' (Tahap '+cur+'/7)'}</b></div><div><span class="text-slate-500">STATUS PEMBAYARAN</span><br><b class="text-emerald-700">${pay}</b></div><div><span class="text-slate-500">PROGRESS KESELURUHAN</span><br><b class="text-brand text-base">${o.progress}%</b></div><div><span class="text-slate-500">TARGET / DEADLINE</span><br><b>${fd(o.deadline)}</b></div></div></section>
<div class="grid grid-cols-[1fr_300px] gap-5 mt-5"><section class="bg-white rounded-2xl shadow-sm p-6"><div class="flex justify-between"><b class="text-base">Progress Pengerjaan</b>${pill(done?'Selesai':'Tahap '+cur+' dari 7')}</div><div class="bg-indigo-50/60 rounded-xl p-3 mt-4 text-[11px] font-bold text-brand">Progress Keseluruhan: ${o.progress}%<div class="h-2 bg-indigo-100 rounded-full mt-2"><div class="h-2 rounded-full bg-gradient-to-r from-brand to-emerald-800" style="width:${o.progress}%"></div></div></div><div class="mt-4 space-y-3">${ST.map((x,i)=>`<div class="flex gap-3 items-start"><b class="w-7 h-7 shrink-0 rounded-full grid place-items-center text-[10px] ${i+1<cur?'bg-emerald-800 text-white':i+1==cur?'bg-brand text-white':'bg-indigo-100 text-brand'}">${i+1<cur?'✓':i+1}</b><div class="flex-1 rounded-xl p-3 ${i+1==cur?'bg-indigo-100 border border-brand/40':'bg-indigo-50/60'}"><div class="flex justify-between"><b>${i+1}. ${x}</b><span class="text-[10px] text-slate-500">${i+1<cur?'Completed':i+1==cur?'IN PROGRESS • AKTIF':'Pending'}</span></div></div></div>`).join('')}</div></section>
<aside class="bg-white rounded-2xl shadow-sm p-6 text-[11px] space-y-3"><b class="text-base">Informasi Pesanan</b>${[['CUSTOMER / LEMBAGA',o.cust],['LAYANAN',o.svc],['DESIGNER PROYEK',o.designer||'Menunggu penugasan admin'],['DEADLINE / ESTIMASI',fd(o.deadline)],['KUOTA REVISI',DB.set.rev]].map(x=>`<div class="bg-indigo-50/60 rounded-xl p-3"><span class="text-slate-500 text-[10px]">${x[0]}</span><br><b>${x[1]}</b></div>`).join('')}${ls.length?`<b class="text-sm block">Aktivitas Terbaru</b>${ls.map(l=>`<div class="bg-indigo-50/60 rounded-xl p-2.5"><b>${l.t}</b><br>${l.m}</div>`).join('')}`:''}</aside></div>
<section class="bg-indigo-50 rounded-2xl p-6 mt-5 flex justify-between items-center"><div><b class="text-lg">Perlu konfirmasi atau ingin berdiskusi?</b><p class="text-xs text-slate-600 mt-1">Konsultasikan langsung setiap tahapan desain bersama desainer proyek dan supervisor studio.</p></div><button onclick="wa('Halo Admin, saya ingin diskusi pesanan ${o.id}')" class="bg-wa text-white font-bold text-xs rounded-lg px-4 py-3">Hubungi Admin via WhatsApp</button></section></div>`}
chead('Lacak Pesanan');cfoot()}
render();
</script></body></html>
